[package]
name         = "tornadoc2-agent"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"

[lib]
name = "tornadoc2_agent"
path = "src/lib.rs"

[[bin]]
name = "beacon"
path = "src/bin/beacon.rs"

[[bin]]
name = "stager"
path = "src/bin/stager.rs"

[dependencies]
# Base — always active.
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
serde    = { version = "1", features = ["derive"] }
serde_json = "1"
base64   = "0.22"
hex      = "0.4"
rand     = "0.8"
sha2     = "0.10"
aes-gcm  = "0.10"
hkdf     = "0.12"
p256     = { version = "0.13", features = ["ecdsa", "ecdh"] }

# Transport — uncomment the crates for the transports you build.
# reqwest           = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
# rustls            = "0.23"
# quinn             = "0.11"
# tokio-tungstenite = "0.24"
# hickory-resolver  = "0.24"
# hickory-proto     = "0.24"
# boringtun         = "0.6"
# boring            = "4"

# Host capabilities — uncomment when the extension host is ported.
# wazero            = "0.1"
# wasmtime          = "24"

[target.'cfg(windows)'.dependencies]
# windows = { version = "0.58", features = [
#     "Win32_Foundation", "Win32_Security",
#     "Win32_System_Threading", "Win32_System_Memory",
#     "Win32_System_Diagnostics_Debug",
# ] }

[features]
default   = []
wasm-host = []

[profile.release]
strip         = "symbols"
lto           = "fat"
panic         = "abort"
codegen-units = 1
