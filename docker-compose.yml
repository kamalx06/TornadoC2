services:
  tornado:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.24.4"
        INSTALL_UPX: "1"
        INSTALL_MINGW: "1"
        INSTALL_DONUT: "0"
        INSTALL_RUST: "0"
        BOOTSTRAP_GO: "1"
    image: tornadoc2:latest
    pull_policy: build
    container_name: tornadoc2
    restart: on-failure

    # ICMP needs CAP_NET_RAW; WireGuard needs CAP_NET_ADMIN
    cap_add:
      - NET_RAW
      - NET_ADMIN

    # WireGuard's netlink binding wants IP forwarding on the host interface
    sysctls:
      net.ipv4.ip_forward: "1"

    ports:
      - "8881:8881"        # beacon HTTP (TLS)
      - "8882:8882"        # SOCKS pivot listener
      - "8883:8883"        # client tunnel (SOCKS5 over operator mTLS)
      - "8884:8884"        # WebSocket
      - "8885:8885/udp"    # QUIC / HTTP/3
      - "53:53/udp"        # DNS TXT
      - "53:53/tcp"        # DNS TCP fallback (needed by DoH resolvers)
      - "12341:12341"      # operator API (mTLS)
      - "51820:51820/udp"  # WireGuard

    volumes:
      - ./tls_certs:/opt/TornadoC2/tls_certs
      - ./mtls_certs:/opt/TornadoC2/mtls_certs
      - ./team_ca:/opt/TornadoC2/team_ca
      - ./.keys:/opt/TornadoC2/.keys
      - ./logs:/opt/TornadoC2/logs
      - ./bofs:/opt/TornadoC2/bofs
      - ./beacon_output:/opt/TornadoC2/beacon_output
      - ./payloads:/opt/TornadoC2/payloads
      - ./profiles:/opt/TornadoC2/profiles

    # Enable only the transports this engagement actually uses.
    # Every transport that is enabled opens a listener; a
    # transport that is not delegated or not reachable at the
    # target is dead weight in the attack surface and, on port
    # 53, a conflict with the host's own resolver.
    #
    # HTTP (--beacon-port) is on by default because every
    # transport falls back through it.
    command:
      - --beacon-port=8881
      - --operator-port=12341
      - --operator-host=0.0.0.0

      # Uncomment DNS to serve the UDP DNS TXT transport and DoH.
      # Requires a delegated authoritative zone and a free UDP/53.
      # On a host running systemd-resolved, either stop the
      # resolver on that interface or bind the container to a
      # non-53 port and put the resolver behind a redirector.
      # - --dns-port=53
      # - --dns-domain=c2.example.com

      # Uncomment QUIC to serve the HTTP/3 transport. Requires
      # aioquic in the image (installed by default).
      # - --beacon-quic-port=8885

      # Uncomment WebSocket to serve wss:// on the given port.
      # Uses the same certificate material as the HTTP listener.
      # - --ws-port=8884

      # Uncomment ICMP to serve the ICMP echo transport. Requires
      # CAP_NET_RAW (see cap_add below).
      # - --icmp

      # Uncomment WireGuard to serve the WireGuard UDP tunnel.
      # Requires CAP_NET_ADMIN (see cap_add below) and the
      # wireguard kernel module on the host.
      # - --wireguard
      # - --wireguard-port=51820

      # Narrow the listener to one C2 profile. By default the
      # listener registers every profile under profiles/c2/.
      # - --beacon-profile=chrome

    environment:
      TORNADO_DEADMAN_HOURS: "${TORNADO_DEADMAN_HOURS:-0}"
      TORNADO_DEADMAN_HALT: "${TORNADO_DEADMAN_HALT:-}"
      TORNADO_DEADMAN_SHRED: "${TORNADO_DEADMAN_SHRED:-dod}"
      TORNADO_NOTIFY: "${TORNADO_NOTIFY:-off}"
      TORNADO_CHECK_CAPS: "1"
      
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8881 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
