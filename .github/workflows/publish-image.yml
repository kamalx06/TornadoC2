name: Publish container image

on:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/tornadoc2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU is what makes the arm64 leg possible on an amd64 runner.
      # Docker Desktop registers this automatically; the GitHub-hosted
      # runner is plain Linux and does not.
      - name: Register QEMU binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      # Cache is what makes the second and subsequent builds fast.
      # Without it, every push rebuilds the Go toolchain, MinGW, and
      # UPX layers from scratch. With it, only the source layers
      # change.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_VERSION=1.24.4
            INSTALL_UPX=1
            INSTALL_MINGW=1
            INSTALL_DONUT=0
            INSTALL_RUST=0
            BOOTSTRAP_GO=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true